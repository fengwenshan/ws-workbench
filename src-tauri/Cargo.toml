[package]
name = "ws-workbench"
version = "1.0.0"
edition = "2021"

[lib]
name = "ws_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 开发构建的二进制名带 -dev，发布构建再改回 ws-workbench。
#
# macOS 的 Dock 磁贴名取的是**可执行文件名**（菜单栏那个应用菜单名另有一套来源，
# 见 build.rs 里注入的 CFBundleName）：裸二进制没有 .app 包，`NSProcessInfo.setProcessName`
# 改不动这两处（试过，重启后仍旧是旧名字），所以开发构建的二进制本身要叫 ws-workbench-dev。
#   - `tauri dev` 直接 `cargo run`，跑的就是这个 bin target；
#   - `tauri build` 按 tauri.conf.json 顶层的 mainBinaryName 把产物改名回
#     ws-workbench，安装包 / 更新载荷 / .app 里的可执行文件都不变。
# path 必须显式写：tauri CLI 用「src/main.rs 是否已被某个 [[bin]] 占用」判断要不要再
# 补一个以包名命名的 bin（tauri-cli 的 get_binaries），漏了会多出一个 ws-workbench bin。
[[bin]]
name = "ws-workbench-dev"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 里把开发构建的 CFBundleName 合并进 TAURI_CONFIG 用
serde_json = "1"

[dependencies]
# macOS 托盘面板要做透明圆角悬浮窗，透明窗口在 macOS 上由这个官方 feature 提供
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
globset = "0.4"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
libc = "0.2"
nix = { version = "0.29", features = ["net", "ioctl", "socket", "fs"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
# 剪贴板历史：官方剪贴板读写 + 全局快捷键（Option+V）
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
base64 = "0.22"
# 剪贴板图文：图片解码 / 缩略图生成
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
rand = "0.8"
sm3 = "0.4"
sm4 = "0.5"
rusqlite = { version = "0.41.1", features = ["bundled"] }
# 系统清理：内存/进程采样（只开 system，不拉磁盘/网络等用不到的重型特性）
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# 删除统一进废纸篓（设计 4.4：不做永久删除）
trash = "5.3"
# 读 macOS 应用的 Info.plist
plist = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# macOS：dev 下是裸二进制（不在 .app 里），Dock 图标只能运行时手动设
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# 剪贴板采集：读 text / html / image
arboard = "3.7"
# NSRunningApplication 用来优雅退出应用（设计 5.4）；它的按 pid 查应用方法
# 在 objc2-app-kit 里由 `libc` 特性控制，必须一起打开
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSImage",
    "NSRunningApplication",
    # 托盘面板定位要读 NSEvent::mouseLocation（逻辑点坐标）+ NSScreen 的菜单栏高度
    "NSEvent",
    "NSScreen",
    # 剪贴板面板：呼出前记前台 App（NSWorkspace）、收起后把焦点还给原来的 App，
    # 并把被激活带上来的主窗口压回后面（NSWindow::orderBack）
    "NSWorkspace",
    "NSWindow",
    # 图文写回：HTML + 纯文本 + PNG/TIFF 一起放上粘贴板（钉钉只认图片类型）
    "NSPasteboard",
    "libc",
] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString"] }

# Windows：注册表枚举卸载项 + 少量 Win32 调用（设计 4.1 / 5.5）
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
# 剪贴板采集：读 text / html / image（Windows 形态同样用 arboard）
arboard = "3.7"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
