[package]
name = "ws-workbench"
version = "1.0.0"
edition = "2021"

[lib]
name = "ws_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macOS 托盘面板要做透明圆角悬浮窗，透明窗口在 macOS 上由这个官方 feature 提供
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
globset = "0.4"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
libc = "0.2"
smoltcp = { version = "0.11", default-features = false, features = [
    "std",
    "alloc",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
] }
nix = { version = "0.29", features = ["net", "ioctl", "socket", "fs"] }
socket2 = "0.6"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
rand = "0.8"
sm3 = "0.4"
sm4 = "0.5"
rusqlite = { version = "0.41.1", features = ["bundled"] }
# 系统清理：内存/进程采样（只开 system，不拉磁盘/网络等用不到的重型特性）
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# 删除统一进废纸篓（设计 4.4：不做永久删除）
trash = "5.3"
# 读 macOS 应用的 Info.plist
plist = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# macOS：dev 下是裸二进制（不在 .app 里），Dock 图标只能运行时手动设
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSRunningApplication 用来优雅退出应用（设计 5.4）；它的按 pid 查应用方法
# 在 objc2-app-kit 里由 `libc` 特性控制，必须一起打开
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSImage",
    "NSRunningApplication",
    "libc",
] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString"] }

# Windows：注册表枚举卸载项 + 少量 Win32 调用（设计 4.1 / 5.5）
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
