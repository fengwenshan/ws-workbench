[package]
name = "ws-workbench"
version = "1.0.0"
edition = "2021"

[lib]
name = "ws_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
globset = "0.4"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
libc = "0.2"
nix = { version = "0.29", features = ["net", "ioctl", "socket", "fs"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
rand = "0.8"
sm3 = "0.4"
sm4 = "0.5"
rusqlite = { version = "0.41.1", features = ["bundled"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# macOS：dev 下是裸二进制（不在 .app 里），Dock 图标只能运行时手动设
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
