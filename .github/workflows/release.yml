name: Release

# push main 时触发发版：先跑 preflight 读 tauri.conf.json 的版本号，
# 该版本还没发布过（GitHub 上没有 v<version> 发行版）才继续构建。
# 版本发布过就整条流程跳过，所以合并 beta、提交清单、改文档都不会重复发版。
# 紧急重跑：Actions 里手动 workflow_dispatch 并勾选 force。
#
# 产出：
#   macOS（Intel + Apple Silicon 各一份）
#     - <product>_<arch>.app.tar.gz + .sig           更新载荷（自动更新用）
#     - <product>_<version>_<arch>.dmg               手工安装包
#   Windows（x64）
#     - ws-workbench-setup.exe + .sig                更新载荷（自动更新用，NSIS）
#     - <product>_<version>_x64_en-US.msi            手工安装包
#
# ─────────────────────────────────────────────────────────────
# 一次性配置（必须做完，否则跑不起来）
#
# 1) 仓库密钥（Settings → Secrets and variables → Actions → New repository secret）
#      TAURI_SIGNING_PRIVATE_KEY  更新签名私钥的**内容**
#                                 （即本机 ~/.tauri/ws-workbench.key 的全文）
#
# 2) 版本号规则
#    版本号唯一来源是 src-tauri/tauri.conf.json 的 version。push main 后 preflight
#    读它；release.mjs 再用 tauri build --config 把它注入构建，不改源文件，
#    不会产生提交回环。tag 由 release.mjs 创建（v<version>），不再手工打 tag。
#
# 安装包与更新清单都在 GitHub：安装包作为发行版附件上传，客户端从
# raw.githubusercontent.com 的 updates/latest.json 读取清单，再按清单里的
# releases/download 地址下载。GitHub 侧用 Actions 自动注入的 GITHUB_TOKEN，
# 只依赖下面那句 permissions: contents: write。
#
# Gitee 镜像（国内下载加速）：最后一个 gitee-sync job 会把三个平台的更新载荷
# 和手工安装包（dmg / msi）镜像到 Gitee 同名 tag 的发行版，并把两份清单里的
# 下载地址改成 Gitee。客户端端点顺序是「Gitee 清单优先，GitHub 清单兜底」，见
# src-tauri/tauri.conf.json 的 plugins.updater.endpoints。
# 需要额外配一个仓库密钥 GITEE_TOKEN（Gitee 私人令牌，projects 权限），
# 以及一个公开的 Gitee 仓库（默认 feng_wenshan/ws-workbench）。
#
# 关于提交回环：CI 提交更新清单时带上 [skip ci]，且本工作流只由 tag 触发，
# 推回 main 的提交不会再次触发构建。
#
# 为什么是三个 job（mac 两个架构 + windows）：
#   * macOS 的 Intel 版在 arm64 runner 上交叉编译（--target x86_64-apple-darwin），
#     不用等 Intel runner —— macos-14 镜像已下线，写死会直接被取消。
#   * Windows 的 MSI 由 WiX 生成，WiX 只有 Windows 版，所以 Windows 安装包
#     必须放在 windows-latest（原生 x64）上构建；之前用 cargo-xwin 交叉编译
#     拿不到 msi。
#   三个 job 并行，共同改 updates/latest.json —— 脚本里用「快进到远端最新 →
#   以远端为基线合并本平台条目 → 推送被拒就撤销重试」保证互不顶掉。
#
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 跳过「版本已发布」检查，强制重建当前 tauri.conf.json 版本
        type: boolean
        default: false

# CI 需要把更新清单的提交推回 main
permissions:
  contents: write

# 同一个分支排队执行，避免两次运行并发写同一个发行版
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发版守卫：push main 时读 tauri.conf.json 的版本号，已经发过就跳过后续所有 job。
  # 这样合并 beta、提交更新清单、改文档都不会重复发版。
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 读版本并判断是否需要发版
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tauri.conf.json 的 version 必须是 X.Y.Z 形式，当前: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "手动强制发版：$VERSION"
            exit 0
          fi

          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} 已发布过，跳过构建"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "本次发布版本：${VERSION}"
          fi

  macos:
    needs: preflight
    if: needs.preflight.outputs.should_release == 'true'
    # 公开仓库使用标准 GitHub 托管 runner 免费（官方计费文档：
    # "free for public repositories that use standard GitHub-hosted runners"）。
    # 注意别写死 macos-14：该镜像已下线，job 会在启动时被直接取消；
    # macos-latest 目前是 macos-26-arm64，Intel 版靠 --target 交叉编译。
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      # 放在最前面：密钥没配就直接退出，避免白等几分钟工具链安装。
      # 只打印长度、不打印内容，不会泄漏密钥。
      - name: 预检（仓库密钥是否已配置）
        env:
          SIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGN_KEY" ]; then
            echo "::error::缺少仓库密钥 TAURI_SIGNING_PRIVATE_KEY（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY 已配置：${#SIGN_KEY} 字节"

      - name: 拉取代码（需要完整历史来生成 Changelog）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust（含目标架构）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-${{ matrix.arch }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 配置清单提交身份
        # 推送认证沿用 actions/checkout 写进 git config 的 extraheader（GITHUB_TOKEN），
        # 这里只需要补上提交者身份。
        run: |
          git config user.name "冯文山"
          git config user.email "fengwenshan@example.com"

      - name: 构建并发布 macOS（${{ matrix.arch }}，含 dmg）
        # TAURI_BUNDLES=app 跳过 Tauri 自带的 bundle_dmg.sh，改用 --dmg 的
        # hdiutil makehybrid 路径（本地已实测通过）。
        # 若想用 Tauri 原生 dmg（带"拖入应用程序"美化背景），
        # 去掉 TAURI_BUNDLES 与 --dmg 两个参数即可。
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAURI_BUNDLES=app node scripts/release.mjs --dmg \
            --target "${{ matrix.target }}" \
            --version "${{ needs.preflight.outputs.version }}"

      - name: 保存产物供人工检查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-macos-${{ matrix.arch }}-${{ needs.preflight.outputs.version }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14

  windows:
    needs: preflight
    if: needs.preflight.outputs.should_release == 'true'
    # Windows 安装包必须原生构建：Tauri 的 MSI 打包依赖 WiX Toolset（只有
    # Windows 可执行文件），在 macOS 上用 cargo-xwin 交叉编译拿不到 msi。
    # windows-latest 是 x64，正好对应 windows-x86_64 更新通道。
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 预检（仓库密钥是否已配置）
        env:
          SIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGN_KEY" ]; then
            echo "::error::缺少仓库密钥 TAURI_SIGNING_PRIVATE_KEY（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY 已配置：${#SIGN_KEY} 字节"

      - name: 拉取代码（需要完整历史来生成 Changelog）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 配置清单提交身份
        # 推送认证沿用 actions/checkout 写进 git config 的 extraheader（GITHUB_TOKEN），
        # 这里只需要补上提交者身份。
        # core.autocrlf 关掉，否则 Windows 上提交 latest.json 会把 LF 改成 CRLF，
        # 每次发版都把清单文件整份「改行尾」。
        run: |
          git config core.autocrlf false
          git config user.name "冯文山"
          git config user.email "fengwenshan@example.com"

      - name: 构建并发布 Windows（exe + msi）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release.mjs --version "${{ needs.preflight.outputs.version }}"

      - name: 保存产物供人工检查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows-x64-${{ needs.preflight.outputs.version }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14

  # 三个平台的包都齐了之后，串行做 Gitee 镜像（Gitee 侧只有一个写者，不并发）：
  #   1. 建 tag vX.Y.Z + 同名发行版，把三个更新载荷和手工安装包（dmg / msi）传上去
  #   2. 把 Gitee 仓库里 updates/latest.json 的下载地址改成 Gitee
  #   3. 把 GitHub main 上的清单也改写成 Gitee 地址（老客户端只认 GitHub 端点，
  #      改完它们升级时也能从 Gitee 下包）
  # 客户端端点顺序见 src-tauri/tauri.conf.json：Gitee 清单优先，GitHub 清单兜底。
  # 上传失败时对应平台保留 GitHub 地址，job 标记失败但清单仍是最新版本。
  gitee-sync:
    needs: [preflight, macos, windows]
    if: needs.preflight.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 下载三个平台的构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets

      # 仓库密钥 GITEE_TOKEN：Gitee → 设置 → 私人令牌（勾选 projects 仓库读写）
      # 可选仓库变量：GITEE_REPO（默认 feng_wenshan/ws-workbench）、
      #              GITEE_BRANCH（默认用 Gitee 仓库的默认分支）
      - name: 镜像到 Gitee 并改写清单
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          GITEE_BRANCH: ${{ vars.GITEE_BRANCH }}
        run: |
          node scripts/gitee-sync.mjs \
            --version "${{ needs.preflight.outputs.version }}" \
            --dir release-assets
